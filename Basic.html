<!DOCTYPE html>
<html>
<head>
<title>Basic HTML Tags Example</title>
</head>

<body>

<!-- Heading Tags -->
<h1>Welcome to HTML</h1>
<h2>Basic HTML Tags</h2>
<h3>This is Heading 3</h3>

<!-- Paragraph -->
<p>This is a paragraph demonstrating <b>bold</b>, <i>italic</i>, and <u>underline</u> text formatting.</p>

<!-- Line Break -->
This is first line<br>
This is second line

<hr>

<!-- Text Formatting -->
<p>
<b>Bold Text</b><br>
<i>Italic Text</i><br>
<u>Underlined Text</u><br>
<strong>Strong Text</strong><br>
<em>Emphasized Text</em>
</p>

</body>
</html>

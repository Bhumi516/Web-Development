<!DOCTYPE html>
<html>
<head>
    <title>Two iFrames Example</title>
</head>
<body>

    <h2>Two Frames Example</h2>

    <!-- First Frame -->
    <iframe 
        src="https://www.wikipedia.org"
        width="45%" 
        height="300"
        title="Wikipedia">
    </iframe>

    <!-- Second Frame -->
    <iframe 
        src="https://www.example.com"
        width="45%" 
        height="300"
        title="Example Website">
    </iframe>

</body>
</html>
